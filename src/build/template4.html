<title>Écoles d'ingé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Terre cuite sur blanc cassé : titres à empattements (Fraunces), texte en Source Sans 3. Une couleur par famille de concours. */
:root {
  --bg: #FAF7F2; --surface: #FFFFFF; --surface-2: #F3ECE2; --surface-3: #EBE1D3;
  --ink: #3A2A1F; --ink-2: #5A4637; --ink-3: #6B5646;
  --line: #EAE1D5; --line-2: #D9C6B1;
  --accent: #B0502A; --on-accent: #FFFFFF; --accent-ink: #8F3E1E; --accent-strong: #8F3E1E; --accent-soft: rgba(176, 80, 42, .10);
  --inv-bg: #3A2A1F; --inv-ink: #FAF7F2; --inv-ink-2: #E7D8C6; --inv-line: #5E4A3C; --inv-accent: #E39A72;
  --ok: #2F6B3A; --ok-soft: rgba(47, 107, 58, .12); --warn: #8A5300; --warn-soft: rgba(138, 83, 0, .12);
  --t1-bg: #DCEBD8; --t1-ink: #24562E; --t2-bg: #F6E3B8; --t2-ink: #7A4C00; --t3-bg: #F2D3C8; --t3-ink: #8F2E14;
  --f-x: #7B2D3B; --f-ens: #94485F; --f-mp: #2E5274; --f-mt: #3F6582; --f-cs: #5B4596;
  --f-inp: #85590F; --f-poly: #4E6A2A; --f-e3a: #66612A; --f-autres: #6E655C;
  --m1: #F1E2D0; --m2: #E7C9A9; --m3: #DCAA82; --m4: #CC8A5F; --m5: #B9683F;
  --shadow: 0 1px 2px rgba(58, 42, 31, .05);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1813; --surface: #2A211A; --surface-2: #33281F; --surface-3: #3D3026;
    --ink: #F3E9DD; --ink-2: #D9C7B4; --ink-3: #BCA894;
    --line: #3E3128; --line-2: #56463A;
    --accent: #DB7B4F; --on-accent: #1F1813; --accent-ink: #F0A27C; --accent-strong: #C4673E; --accent-soft: rgba(219, 123, 79, .14);
    --inv-bg: #3A2D24; --inv-ink: #F3E9DD; --inv-ink-2: #D9C7B4; --inv-line: #56463A; --inv-accent: #F0A27C;
    --ok: #86C994; --ok-soft: rgba(134, 201, 148, .14); --warn: #E9B566; --warn-soft: rgba(233, 181, 102, .14);
    --t1-bg: rgba(134, 201, 148, .18); --t1-ink: #A3D9AE; --t2-bg: rgba(233, 181, 102, .18); --t2-ink: #F0C887; --t3-bg: rgba(236, 132, 104, .18); --t3-ink: #F4AE97;
    --f-x: #E08C9B; --f-ens: #E6A6BA; --f-mp: #8DB5E0; --f-mt: #ABC8E5; --f-cs: #B9A8EC;
    --f-inp: #E2B35E; --f-poly: #AACB7D; --f-e3a: #D3CB80; --f-autres: #C4BAAE;
    --m1: #3A2D24; --m2: #573D2D; --m3: #774E36; --m4: #985F40; --m5: #BA744E;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1813; --surface: #2A211A; --surface-2: #33281F; --surface-3: #3D3026;
  --ink: #F3E9DD; --ink-2: #D9C7B4; --ink-3: #BCA894;
  --line: #3E3128; --line-2: #56463A;
  --accent: #DB7B4F; --on-accent: #1F1813; --accent-ink: #F0A27C; --accent-strong: #C4673E; --accent-soft: rgba(219, 123, 79, .14);
  --inv-bg: #3A2D24; --inv-ink: #F3E9DD; --inv-ink-2: #D9C7B4; --inv-line: #56463A; --inv-accent: #F0A27C;
  --ok: #86C994; --ok-soft: rgba(134, 201, 148, .14); --warn: #E9B566; --warn-soft: rgba(233, 181, 102, .14);
  --t1-bg: rgba(134, 201, 148, .18); --t1-ink: #A3D9AE; --t2-bg: rgba(233, 181, 102, .18); --t2-ink: #F0C887; --t3-bg: rgba(236, 132, 104, .18); --t3-ink: #F4AE97;
  --f-x: #E08C9B; --f-ens: #E6A6BA; --f-mp: #8DB5E0; --f-mt: #ABC8E5; --f-cs: #B9A8EC;
  --f-inp: #E2B35E; --f-poly: #AACB7D; --f-e3a: #D3CB80; --f-autres: #C4BAAE;
  --m1: #3A2D24; --m2: #573D2D; --m3: #774E36; --m4: #985F40; --m5: #BA744E;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent-ink); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 1216px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
.narrow { max-width: 780px; margin: 0 auto; width: 100%; }
.serif { font-family: var(--serif); }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[id] { scroll-margin-top: 84px; }

/* ---------- en-tête et navigation ---------- */
.top { background: var(--bg); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; min-height: 44px; margin-right: auto; border: 0; background: none; padding: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--ink); letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--accent-ink); margin-left: 6px; }
.nav-links, .nav-search, .nav-searchbtn { display: none; }
.filsw { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.filsw button { min-height: 38px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 999px; background: none; font-weight: 700; font-size: 15px; color: var(--ink-2); }
.filsw button:hover { color: var(--ink); }
.filsw button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.filpick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.filpick .chips { gap: 6px; }
.filpick .chip { min-width: 56px; padding: 0 12px; justify-content: center; }
.chip[disabled] { opacity: .5; cursor: default; gap: 5px; }
.chip .soon { font-size: 12px; font-weight: 600; }
.filnote { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.nl { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: none; font-size: 15.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.nl:hover { background: var(--surface-2); }
.nl[aria-current="page"] { background: var(--surface-2); color: var(--accent-ink); font-weight: 700; }
.nav-search { position: relative; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--bg); border: 1.5px solid var(--line-2); border-radius: 12px; }
.nav-search:focus-within { border-color: var(--accent); }
.nav-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15.5px; }
.nav-search input::placeholder { color: var(--ink-3); }
.nsuggest { position: absolute; top: calc(100% + 6px); right: -1.5px; width: min(380px, 80vw); max-height: 70vh; overflow: auto; padding: 6px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 10px 30px rgba(40, 25, 15, .16); z-index: 40; }
.ns-item { display: flex; flex-direction: column; gap: 1px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px; background: none; text-align: left; color: var(--ink); }
.ns-item:hover, .ns-item:focus-visible { background: var(--surface-2); }
.ns-item .nm { font-weight: 700; font-size: 15px; }
.ns-item .sub { font-size: 13.5px; color: var(--ink-3); }
.ns-all { width: 100%; min-height: 44px; margin-top: 4px; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--accent-ink); font-weight: 700; }
.ns-empty { margin: 8px 10px; }
.nav-searchbtn { align-items: center; justify-content: center; width: 44px; height: 44px; border: 1.5px solid var(--line-2); border-radius: 12px; background: var(--bg); color: var(--ink-2); }
.pill-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px; white-space: nowrap; }
.pill-btn[aria-current="page"] { background: var(--accent-strong); }
.pill-btn .count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--on-accent); color: var(--accent); font-size: 13px; }
.icon { width: 18px; height: 18px; flex: none; }
@media (min-width: 720px) {
  .filsw { margin-right: 6px; }
  body::before { background: var(--surface); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { margin-right: 6px; }
  .nav-links { display: flex; flex: 0 0 auto; gap: 2px; }
  .nav-searchbtn { display: inline-flex; margin-left: auto; }
}
@media (min-width: 800px) {
  .nav-searchbtn { display: none; }
  .nav-search { display: flex; margin-left: auto; flex: 1 1 140px; max-width: 300px; min-width: 140px; }
}
body[data-view="home"] .nav-search, body[data-view="home"] .nav-searchbtn { display: none; }

/* ---------- éléments communs ---------- */
main { padding-block: 8px 72px; }
.crumbs { display: flex; align-items: center; min-height: 44px; margin-bottom: 6px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 6px 0 0; border: 0; background: none; color: var(--accent-ink); font-weight: 600; font-size: 15px; }
.trail { display: none; }
.trail button { min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent-ink); font-weight: 600; font-size: 15px; }
.trail .sep { color: var(--ink-3); }
.trail [aria-current] { font-weight: 600; color: var(--ink-2); }
@media (min-width: 720px) {
  main { padding-top: 14px; }
  .crumbs .back { display: none; }
  .trail { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 15px; }
}
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 6.4vw, 50px); line-height: 1.06; letter-spacing: -.015em; margin: 0; }
.h2 { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.2; margin: 0; }
.h3 { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; margin: 0; }
.lede { margin: 0; font-size: 17.5px; line-height: 1.5; color: var(--ink-2); max-width: 62ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.soft { background: var(--surface-2); border-radius: 18px; padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 700; font-size: 15px; text-align: left; }
.swatch { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
.swatch.lg { width: 48px; height: 48px; border-radius: 13px; }
.swatch.md { width: 28px; height: 28px; border-radius: 8px; }
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; }
.chip .n { opacity: .72; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .dot { width: 11px; height: 11px; border-radius: 999px; background: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--ink); }
.label { font-size: 15px; font-weight: 700; margin: 0; }
.warnpill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 700; }
.okpill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-size: 13px; font-weight: 700; }
.rtag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.rtag.t1 { background: var(--t1-bg); color: var(--t1-ink); }
.rtag.t2 { background: var(--t2-bg); color: var(--t2-ink); }
.rtag.t3 { background: var(--t3-bg); color: var(--t3-ink); }
details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; padding: 0 16px; font-weight: 700; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: 20px; color: var(--accent-ink); }
details.more[open] > summary::after { content: "–"; }
details.more .in { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
details.more ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-size: 15px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
select.sel { min-height: 44px; max-width: 100%; padding: 0 10px; border: 1.5px solid var(--line-2); border-radius: 12px; background: var(--surface); font-size: 15px; }

/* ---------- accueil ---------- */
.hero { display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: flex-start; padding-top: 8px; }
.hero-main { flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.hero-side { flex: 1 1 340px; min-width: 0; }
.field { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 14px; }
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 17.5px; }
.field input::placeholder { color: var(--ink-3); }
.hero-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.hero-acts .btn { flex: 1 1 150px; }
@media (min-width: 720px) { .hero-acts .btn { flex: 0 0 auto; padding: 0 18px; } }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
.tile { display: flex; flex-direction: column; gap: 8px; min-height: 140px; padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); box-shadow: var(--shadow); }
.tile:hover { border-color: var(--c); }
.tile .t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; line-height: 1.15; }
.tile .d { font-size: 14.5px; line-height: 1.38; color: var(--ink-3); }
.tile .k { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--c); }
@media (min-width: 760px) { .tile { min-height: 150px; padding: 18px 20px; gap: 10px; } .tile .t { font-size: 19px; } .tile .d { font-size: 15.5px; } .tile .k { font-size: 15px; } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.42; }
.steps .i, .ep-h .i { flex: none; width: 26px; height: 26px; border-radius: 999px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.suggest { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }

/* ---------- lignes d'école (recherche, régions) ---------- */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); box-shadow: var(--shadow); }
.row:hover { border-color: var(--line-2); }
.row .main { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.row .nm, .srow .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.row .sub, .srow .sub { font-size: 14px; color: var(--ink-3); }
.fams { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fams span { display: inline-flex; align-items: center; gap: 5px; }
.chev { flex: none; color: var(--accent-ink); }

/* ---------- page concours ---------- */
.fam-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px 32px; }
.fam-id { flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.fam-head { display: flex; align-items: center; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: 1 1 100%; }
@media (min-width: 720px) { .facts { flex: 0 1 492px; gap: 10px; } }
.fact { display: flex; flex-direction: column; gap: 3px; padding: 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.fact .v { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.12; overflow-wrap: anywhere; }
.fact .s { font-size: 13.5px; line-height: 1.32; color: var(--ink-3); }
@media (max-width: 480px) { .fact .v { font-size: 18px; } .fact { padding: 10px 8px; } .fact .s { font-size: 13px; } }
.style-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.style-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px 28px; }
.style-grid > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.style-grid p { margin: 0; font-size: 15.5px; line-height: 1.5; }
.style-grid .srcs { font-size: 13.5px; }
.fam-cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; }
.fam-schools { flex: 7 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.fam-ep { flex: 5 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.rk-box { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; background: var(--inv-bg); color: var(--inv-ink); border-radius: 16px; }
.rk-box label { font-weight: 700; font-size: 16px; }
.rk-box input { width: 140px; height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 20px; font-weight: 700; }
.rk-box span { flex: 1 1 200px; font-size: 14.5px; line-height: 1.4; color: var(--inv-ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; }

    h += "<h2>Concours, banque, liste de vœux</h2><ul>";
    h += "<li><b>Un concours</b> classe les candidats après des écrits, puis des oraux pour les admissibles. Une <b>banque</b> regroupe des écoles qui utilisent les mêmes écrits mais font chacune leur classement.</li>";
    h += "<li>Tu t'inscris sur le site du SCEI en décembre-janvier, puis tu classes tes écoles dans ta <b>liste de vœux</b> jusqu'à fin juillet. Une école que tu mets au-dessus d'une autre passe avant : si elle t'est proposée, tu perds celles d'en dessous.</li>";
    h += "<li>Certains concours partagent leurs écrits : X et ENS, Mines-Ponts et Mines-Télécom, et en partie Polytech et le CCINP. Chaque page de concours détaille ses épreuves et renvoie vers sa notice officielle.</li></ul>";
    h += "<h2>Lire les chiffres</h2><ul>";
    h += "<li><b>Places 2026</b> : places offertes à la session 2026, la dernière publiée (notices des concours, L'Étudiant, Onisep). « Pour les " + FIL + " » : places réservées à la " + FIL + ". Sinon, elles sont partagées avec d'autres filières.</li>";
    h += "<li><b>Rang médian 2025</b> : la moitié des élèves de " + FIL + " admis en 2025 étaient classés avant ce rang (statistiques du SCEI, les dernières publiées). Le SCEI ne publie pas le rang du dernier appelé.</li>";
    h += "<li><b>Un rang ne se compare qu'à l'intérieur d'une même liste de classement.</b> Mines-Ponts, le CCINP ou Polytech ont une seule liste : on peut trier leurs écoles par rang. À Centrale-Supélec, dans la banque CCINP, aux ENS ou dans les écoles indépendantes d'e3a, chaque école a sa propre liste : les rangs ne se comparent pas d'une école à l'autre.</li>";
    h += "<li><b>Ton repère</b> : sur les pages Mines-Ponts, Mines-Télécom, Centrale-Supélec et CCINP, tu peux entrer ton rang, réel ou visé. « Dans tes cordes » : ton rang est meilleur que le rang médian des admis 2025. « Juste » : jusqu'à une fois et demie ce rang. « Ambitieux » : au-delà. C'est un ordre de grandeur, pas une prédiction : les rangs bougent d'une année sur l'autre.</li>";
    h += "<li><b>Poids des oraux</b> : part des coefficients de l'oral dans le total du classement final, d'après les notices 2026.</li>";
    if (FIL === "MPI") h += "<li><b>Liste commune à plusieurs filières</b> (Ingéni'Up, certaines écoles indépendantes d'e3a, quelques domaines INSA) : les filières sont classées ensemble ; places et rangs ne sont pas propres à la MPI. Polytech, lui, a une liste MPI à part.</li>";
    else h += "<li><b>Liste commune à plusieurs filières</b> (Polytech, Ingéni'Up, plusieurs domaines INSA) : MP, PC et PSI sont classés ensemble ; places et rangs ne sont pas propres à la " + FIL + ".</li>";
    if (FIL === "PC") h += "<li><b>Deux listes au CCINP</b> : en PC, le CCINP fait deux concours sur les mêmes copies, PC-Physique et PC-Chimie, avec des coefficients inversés. Une école peut recruter sur l'une, sur l'autre, ou sur les deux selon la spécialité : compare les rangs liste par liste.</li>";
    h += "<li><b>Peu de places, rangs instables</b> : avec 2 à 6 places, un rang 2025 peut beaucoup bouger en 2026.</li>";
    h += "<li><b>« Classement 2025 … »</b> : en 2025, l'école figurait dans une autre section du SCEI (autre concours ou autre liste) ; son rang ne se compare pas directement à ceux de 2026.</li></ul>";
    h += "<h2>Le style des concours</h2><ul>";
    h += "<li>« Les sujets » résume le rapport du jury cité en lien (le dernier publié, en général en maths). « Pour qui » est un avis, déduit de ces rapports et du poids des épreuves : à prendre comme tel.</li></ul>";
    h += "<h2>Frais et boursiers</h2><ul>";
    h += "<li>Frais par an pour un étudiant français, au montant le plus récent trouvé, avec son année. La CVEC (105 €) s'ajoute en général, sauf pour les boursiers.</li>";
    if (own.length) h += "<li>La plupart des écoles publiques appliquent le droit national (630 €/an en 2026-2027). " + own.length + " écoles publiques demandent plus, de " + fmt(own[0]._fee) + " € (" + esc(own[0].nom) + ") à " + fmt(own[own.length - 1]._fee) + " € (" + esc(own[own.length - 1].nom) + ").</li>";
    h += "<li>À l'X, aux ENS et dans les écoles militaires, les élèves sont payés pendant leurs études, en échange d'un engagement à servir l'État.</li>";
    h += "<li>« À vérifier » : source ancienne, non officielle, ambiguë ou absente. Chaque fiche donne ses sources.</li></ul>";
    h += "<h2>Ce qui a changé en 2026</h2><ul>";
    h += "<li>ENSTA Paris et ENSTA Bretagne ont fusionné : places à Palaiseau et à Brest via Mines-Ponts, et nouvelle formation défense et sécurité (FIDS), codélivrée avec l'ISAE-SUPAERO, via Mines-Télécom.</li>";
    h += "<li>L'ENAC et l'ISAE-ENSMA ont quitté le CCINP pour Mines-Télécom.</li>";
    h += "<li>Les écoles de l'ex-concours Puissance Alpha recrutent maintenant les " + FIL + " via e3a-Polytech (" + esc(pa.map(function (s) { return s.nom; }).join(", ")) + ") ; l'ESIEE Paris, via la banque CCINP.</li>";
    h += "<li>Nouvelles venues : Centrale Lyon ENISE (banque CCINP) et Aflokkat MIRA (e3a-Polytech). L'ECE n'est plus dans Avenir Prépas.</li>";
    h += "<li>Noms récents, que la recherche reconnaît aussi sous l'ancien nom : Géodata Paris (ex-ENSG Géomatique), Centrale Méditerranée (ex-Centrale Marseille).</li></ul>";
    h += "<h2>Pas dans cette liste</h2><ul>" + D.exclus.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
    h += '<h2 id="sources">Sources principales</h2><ul>' + D.sources.map(function (x) { return '<li><a href="' + esc(x.u) + '" target="_blank" rel="noopener">' + esc(x.t) + "</a></li>"; }).join("") + "</ul>";
    h += '<p class="small muted">Données ' + FIL + ' relevées le ' + esc(dateFr(D.maj)) + '. Les notices de la session 2027 ne sont pas encore publiées : épreuves, places et tarifs sont ceux de 2026 et peuvent changer.</p></div>';
    return h;
  }

  /* ---------- événements ---------- */
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".nav-search")) closeNavSuggest(false);
    var t = e.target.closest("button, path[data-region]"); if (!t) return;
    var d = t.dataset;
    if (t.tagName.toLowerCase() === "path") { ui.lieu.reg = d.region; render("keep"); var rs = $("regsel"); if (rs) rs.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
    if (d.fil) { setFil(d.fil); return; }
    if (d.back) { back(); return; }
    if (d.pop != null) { popTo(+d.pop); return; }
    if (d.nsall) { var nq = $("nq").value.trim(); ui.res = newRes({ q: nq, title: "Recherche « " + nq + " »" }); go("resultats"); return; }
    if (d.go) {
      if (d.go === "resultats" && d.arg === "q") { ui.res = newRes({ q: ui.q.trim(), title: "Recherche « " + ui.q.trim() + " »" }); go("resultats"); return; }
      go(d.go, d.arg);
      if (d.focus && $(d.focus)) { try { $(d.focus).focus(); } catch (err) { /* rien */ } }
      return;
    }
    if (d.more) { ui.fam.more[d.more] = !ui.fam.more[d.more]; render("keep"); return; }
    if (d.lieu != null) { ui.lieu.reg = d.lieu || null; render("keep"); if (d.lieu) { var rsel = $("regsel"); if (rsel) rsel.scrollIntoView({ block: "start", behavior: "smooth" }); } return; }
    if (d.spec) { ui.res = newRes({ doms: [d.spec], title: D.domaines[d.spec] }); go("resultats"); return; }
    if (d.gfam) { var g = ui.guide; if (d.gfam === "none") g.fams = []; else toggleIn(g.fams, d.gfam); render("keep"); return; }
    if (d.gloc) { ui.guide.loc = d.gloc; render("keep"); return; }
    if (d.gdom) { var gg = ui.guide; if (d.gdom === "none") gg.doms = []; else toggleIn(gg.doms, d.gdom); render("keep"); return; }
    if (d.guidego) { var G = ui.guide; ui.res = newRes({ fams: G.fams.slice(), doms: G.doms.slice(), loc: G.loc === "any" ? null : G.loc, title: "Écoles pour toi" }); go("resultats"); return; }
    if (d.rdel) {
      var p = d.rdel.split("|"), f = ui.res;
      if (p[0] === "q") f.q = ""; else if (p[0] === "fam") toggleIn(f.fams, p[1]); else if (p[0] === "reg") toggleIn(f.regs, p[1]);
      else if (p[0] === "loc") f.loc = null; else if (p[0] === "dom") toggleIn(f.doms, p[1]); else if (p[0] === "pub") f.pub = false; else if (p[0] === "bours") f.bours = false;
      render("keep"); return;
    }
    if (d.radd) {
      var q = d.radd.split("|"), r = ui.res; r.refine = true;
      if (q[0] === "fam") toggleIn(r.fams, q[1]); else if (q[0] === "dom") toggleIn(r.doms, q[1]); else if (q[0] === "pub") r.pub = !r.pub; else if (q[0] === "bours") r.bours = !r.bours;
      render("keep"); return;
    }
  });
  document.addEventListener("toggle", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.refine && ui.res) ui.res.refine = t.open;
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && e.target && e.target.id === "nq") closeNavSuggest(false);
  });
  function toggleIn(arr, v) { var i = arr.indexOf(v); if (i === -1) arr.push(v); else arr.splice(i, 1); }
  document.addEventListener("submit", function (e) {
    var form = e.target.dataset.form;
    if (form === "search") {
      e.preventDefault();
      var q = ($("q") && $("q").value || "").trim(); if (!q) return;
      ui.q = q; ui.res = newRes({ q: q, title: "Recherche « " + q + " »" }); go("resultats");
    } else if (form === "nsearch") {
      e.preventDefault();
      var nq = ($("nq").value || "").trim(); if (!nq) return;
      ui.res = newRes({ q: nq, title: "Recherche « " + nq + " »" }); go("resultats");
    }
  });
  var qTimer, nqTimer;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(function () { ui.q = t.value; renderSuggest(); }, 120); return; }
    if (t.id === "nq") { clearTimeout(nqTimer); nqTimer = setTimeout(renderNavSuggest, 120); return; }
    if (t.dataset && t.dataset.rank) {
      var cid = t.dataset.rank, n = parseInt(t.value, 10);
      if (n > 0 && n < 100000) rang[cid] = n; else delete rang[cid];
      updateTags(cid);
      return;
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.rsort && ui.res) { ui.res.sort = t.value; render("keep"); return; }
    if (t.dataset && t.dataset.freg) { ui.fam.reg = t.value; render("keep"); return; }
    if (t.dataset && t.dataset.fdom) { ui.fam.dom = t.value; render("keep"); return; }
  });

  /* ---------- démarrage ---------- */
  applyFil(FIL);
  var hash = (location.hash || "").replace("#", "");
  if (hash === "comprendre" || hash === "guide" || hash === "cote") nav.push({ v: hash });
  render("top");
})();
</script>
